{% set name = "python-engineio" %}
{% set version = "4.13.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/miguelgrinberg/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 5272f492c322982c34badcf7fb4d5caeb388fe012fc587c5ccf669edce92b297

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<38]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools >=61.2
  run:
    - python
    - simple-websocket >=0.10.0
  run_constrained:
    # client
    - requests >=2.21.0
    - websocket-client >=0.54.0
    # asyncio_client
    - aiohttp >=3.11

# > raise RuntimeError("Event loop stopped before Future completed.")
# E RuntimeError: Event loop stopped before Future completed.
{% set skip_tests = "TestAsyncServer or TestSocket or TestTornado" %}

test:
  source_files:
    - tests
  imports:
    - engineio
    - engineio.middleware
    - engineio.packet
    - engineio.payload
    - engineio.server
    - engineio.socket
    - engineio.async_drivers
  requires:
    - pip
    - pytest
    - aiohttp
    - tornado
    - websocket-client
    - requests
    - pytest-tornasync
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v -k "not ({{ skip_tests }})" tests

about:
  home: https://github.com/miguelgrinberg/python-engineio
  license_file: LICENSE
  license: MIT
  license_family: MIT
  summary: Python Engine.IO server and client
  description: This project implements Python based Engine.IO client and server that can run standalone or integrated with a variety of Python web frameworks and applications.
  doc_url: https://python-engineio.readthedocs.io
  dev_url: https://github.com/miguelgrinberg/python-engineio

extra:
  recipe-maintainers:
    - pmlandwehr
    - ReimarBauer
    - synapticarbors
